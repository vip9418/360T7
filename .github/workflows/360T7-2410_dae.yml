name: 360T7-2410_dae

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_PATCH: ./config/360T7_2410_dae.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DIY_P3_SH: diy-part3.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 拉取仓库代码
      uses: actions/checkout@main

    - name: 🧹 释放磁盘空间
      run: |
        echo "======= 清理前磁盘空间 ======="
        df -hT
        sudo rm -rf \
          /usr/share/dotnet /usr/share/swift /usr/share/java \
          /usr/share/ruby /usr/local/lib/android \
          /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium \
          /usr/local/share/edge_driver /usr/local/share/gecko_driver \
          /usr/local/share/chromedriver-linux64 \
          /opt/ghc /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
          /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go \
          /opt/az /opt/microsoft /opt/pipx \
          /usr/lib/jvm /usr/lib/mono /usr/lib/R \
          /usr/lib/postgresql /usr/lib/heroku
        sudo docker image prune --all --force
        sudo apt-get purge -y \
          azure-cli google-cloud-cli google-chrome-stable \
          firefox powershell mono-devel libgl1-mesa-dri \
          'php*' 'dotnet*' 'llvm*' 'ruby*' 2>/dev/null || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        echo "======= 清理后磁盘空间 ======="
        df -hT

    - name: 🔧 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 📦 克隆源码
      working-directory: /workdir
      run: |
        git clone --depth=1 --single-branch \
          -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ✅ ccache 缓存恢复（克隆源码后立即执行）
    - name: 🗃️ 恢复 ccache 缓存
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-
          ccache-${{ runner.os }}-

    - name: 🔌 加载自定义 feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 🔄 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 🧹 清理冲突包
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 📲 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: ⚙️ 加载配置
      run: |
        cd openwrt
        echo ">>> 复制用户完整配置..."
        cp -f $GITHUB_WORKSPACE/$CONFIG_PATCH .config
        echo "  ✓ 配置已加载: $CONFIG_PATCH"

        chmod +x $GITHUB_WORKSPACE/$DIY_P3_SH
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: 📡 下载软件包
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 🔨 编译固件
      run: |
        cd openwrt
        echo "Available CPU cores: $(nproc)"
        make -j$(nproc) || make -j1 || make -j1 V=s

    # ✅ ccache 统计（编译完成后打印命中率，方便评估效果）
    - name: 📈 ccache 统计
      if: always()
      run: |
        echo "======= ccache 统计 ======="
        ccache -s 2>/dev/null || echo "ccache 未安装或未使用"

    - name: ❌ 上传编译失败日志
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          openwrt/.config
          openwrt/logs/

    - name: 📂 整理固件路径
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo ""
        echo "============= 全部生成文件 ============="
        ls -lh
        echo "========================================"

    - name: 🏷️ 生成发布标签
      id: tag
      run: |
        echo "release_tag=360T7-dae-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: 🚀 发布固件到 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body: |
          ## 360T7 ImmortalWrt (dae)
          - 源码: padavanonly/immortalwrt-mt798x-6.6 @ openwrt-24.10-6.6
          - 基础配置: defconfig/mt7981-ax3000_dae.config
          - 驱动: 闭源 MTK SDK (kmod-mt_wifi)
          - 内核: Linux 6.6 / MediaTek MT7981B
          - 代理: daed + luci-app-daede + luci-app-openclash
          - 主题: luci-theme-argon
          - 固件格式: .bin
          - 编译时间: ${{ steps.tag.outputs.release_tag }}
        files: |
          ${{ env.FIRMWARE }}/*sysupgrade*
          ${{ env.FIRMWARE }}/*initramfs*
          ${{ env.FIRMWARE }}/*factory*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🗑️ 清理旧版本
      uses: ophub/delete-releases-workflows@main
      with:
        delete_releases: true
        releases_keep_latest: 2
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 3
        gh_token: ${{ secrets.GITHUB_TOKEN }}
