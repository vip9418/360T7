name: 360T7-2410_dae

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: owrt
  CONFIG_FILE: ./config/360T7_2410_dae.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DIY_P3_SH: diy-part3.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 拉取仓库代码
      uses: actions/checkout@main

    - name: 🧹 释放磁盘空间
      run: |
        echo "======= 清理前磁盘空间 ======="
        df -hT
        sudo rm -rf \
          /usr/share/dotnet /usr/share/swift /usr/share/java \
          /usr/share/ruby /usr/local/lib/android \
          /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium \
          /usr/local/share/edge_driver /usr/local/share/gecko_driver \
          /usr/local/share/chromedriver-linux64 \
          /opt/ghc /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
          /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go \
          /opt/az /opt/microsoft /opt/pipx \
          /usr/lib/jvm /usr/lib/mono /usr/lib/R \
          /usr/lib/postgresql /usr/lib/heroku
        sudo docker image prune --all --force
        sudo apt-get purge -y \
          azure-cli google-cloud-cli google-chrome-stable \
          firefox powershell mono-devel libgl1-mesa-dri \
          'php*' 'dotnet*' 'llvm*' 'ruby*' 2>/dev/null || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        echo "======= 清理后磁盘空间 ======="
        df -hT

    - name: 🔧 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 📦 克隆源码
      working-directory: /workdir
      run: |
        git clone --depth=1 --single-branch \
          -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ─────────────────────────────────────────────
    # STAGE 1：feeds update 之前
    # 只向 feeds.conf.default 写入 feed 地址
    # feeds/ 目录此时不存在，严禁任何 rm -rf feeds/ 操作
    # ─────────────────────────────────────────────
    - name: 🔌 加载自定义 feeds（写入 feeds.conf.default）
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 🔄 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ─────────────────────────────────────────────
    # STAGE 2：feeds update 之后、feeds install 之前
    # feeds/ 目录已存在，安全执行替换和清理操作
    # ─────────────────────────────────────────────
    - name: 🧹 清理冲突包（替换 golang / 删除冲突 feeds）
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 📲 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ─────────────────────────────────────────────
    # STAGE 3：feeds install 之后
    # 所有包已就位，执行系统配置和主题美化
    # ─────────────────────────────────────────────
    - name: ⚙️ 加载自定义配置（系统 & 主题）
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: 📡 下载编译所需软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 🔨 编译固件
      run: |
        cd openwrt
        echo "Available CPU cores: $(nproc)"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: ❌ 上传编译失败日志
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          openwrt/.config
          openwrt/logs/

    - name: 📂 整理固件路径 & 列出生成文件
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

        echo ""
        echo "============================================="
        echo "  固件输出目录: $PWD"
        echo "============================================="
        echo ""

        echo ">>> 固件文件（按大小排序）："
        ls -lhS *.{bin,itb,ubi,img} 2>/dev/null || true

        echo ""
        echo ">>> sysupgrade 文件："
        ls -lh *sysupgrade* 2>/dev/null || echo "  ⚠ 未找到 sysupgrade 文件"

        echo ""
        echo ">>> initramfs 文件："
        ls -lh *initramfs* 2>/dev/null || echo "  ⚠ 未找到 initramfs 文件"

        echo ""
        echo ">>> factory 文件："
        ls -lh *factory* 2>/dev/null || echo "  ⚠ 未找到 factory 文件"

        echo ""
        echo ">>> 所有文件："
        ls -lh

    - name: 🏷️ 生成发布标签
      id: tag
      run: |
        echo "release_tag=360T7-dae-$(date +'%Y%m%d-%H%M')" \
          >> $GITHUB_OUTPUT

    - name: 🚀 发布固件到 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body: |
          ## 360T7 ImmortalWrt (dae)
          - 源码: VIKINGYFY/immortalwrt @ owrt
          - 驱动: 标准 mac80211 / mt76（非 MTK SDK）
          - 内核: Linux 6.6 / MediaTek MT7981B
          - 防火墙: firewall4 / nftables
          - 代理: luci-app-daede
          - 主题: luci-theme-argon（自定义美化）
          - 编译时间: ${{ steps.tag.outputs.release_tag }}
        # ✅ 核心修复：使用通配符兼容 .bin 和 .itb 两种格式
        files: |
          ${{ env.FIRMWARE }}/*sysupgrade*
          ${{ env.FIRMWARE }}/*initramfs*
          ${{ env.FIRMWARE }}/*factory*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🗑️ 清理旧版本 Release 和工作流记录
      uses: ophub/delete-releases-workflows@main
      with:
        delete_releases: true
        releases_keep_latest: 2
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 3
        gh_token: ${{ secrets.GITHUB_TOKEN }}
